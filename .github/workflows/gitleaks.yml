# =============================================================================
# Gitleaks Secret Scanning
# Scans commits for hardcoded secrets, API keys, passwords, and other
# sensitive credentials that should not be checked into source control.
# =============================================================================

name: "Gitleaks Secret Scanning"

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # ⚠️ Named explicitly rather than relying on root auto-discovery. The
          # action shells out to the gitleaks binary from a working directory it
          # chooses, and a config it does not find is not an error — the scan
          # simply runs with the default rules and fails on the test fixtures
          # again, which reads as "the allowlist does not work". See
          # .gitleaks.toml for why the allowlist names literals, not paths.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
