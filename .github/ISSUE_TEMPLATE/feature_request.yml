name: ✨ Feature Request
description: Suggest a new feature, tool, or enhancement for Agent-2
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide details about your proposal to help us evaluate and design it.
  - type: dropdown
    id: category
    attributes:
      label: Affected Subsystem / Surface
      description: Which part of Agent-2 does this feature apply to?
      options:
        - CLI (agent2cli.py)
        - Web UI (agent2web.py)
        - Agent Tools / Tool Dispatcher
        - Context Broker / Memory / Rules
        - DAG / Workflows / UltraCode
        - MCP Bridges (Burp / ZAP / Custom)
        - Security / Authentication
        - File Intelligence
        - Documentation / Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: I'm frustrated when... / It would be easier to...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or capability you'd like to see added.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, UI mockups, architectural notes, or screenshots.
